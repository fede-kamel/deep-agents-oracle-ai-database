[project]
name = "deepagents-oracle-health"
version = "0.1.0"
description = "LangChain Deep Agents on Oracle AI Database 26ai: a pre-visit clinical brief over synthetic patients, run inside an NVIDIA OpenShell sandbox"
requires-python = ">=3.12"
dependencies = [
  "langchain-oci==0.3.2",
  "langchain-oracledb>=1.0",
  "langchain-openai>=1.0",
  "deepagents>=0.2",
  "oracledb>=3.3,<4",
  "datasets>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-docx>=1.1",
  "langchain-community>=0.4.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "langgraph-oracledb==1.0.1",
]

[tool.uv]
package = false
