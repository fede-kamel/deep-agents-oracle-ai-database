# The whole sandbox policy. The provider (OCI Generative AI) contributes the one
# HTTP surface; this adds the database listener, for the Python interpreter only.
# Everything else has no rule, so no connection opens. run_in_sandbox.sh fills
# in the host and port.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /sandbox]
landlock:
  compatibility: best_effort
process:
  run_as_user: "1500"
  run_as_group: "1500"
network_policies:
  oracle_ai_database:
    name: Oracle AI Database (TLS listener)
    endpoints:
      - host: __DB_HOST__
        port: __DB_PORT__
        protocol: tcp
        tls: skip          # the client starts TLS itself; the proxy relays it unopened
    binaries:
      - path: /usr/local/bin/python3.12
