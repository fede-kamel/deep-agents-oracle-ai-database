# Sandbox policy for the pre-visit brief agent.
#
# The provider profile (profile/oci-genai-python.yaml) contributes the one
# HTTP surface: OCI Generative AI's OpenAI-compatible path, where the proxy
# swaps the key placeholder for the real key. This policy adds the one non-HTTP
# surface: the Autonomous Database listener, for the Python interpreter only.
# Everything else has no rule, so no connection opens.
#
# scripts/sandbox.sh renders __DB_HOST__ and __DB_PORT__ from the config file.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc]
  read_write: [/tmp, /sandbox]
landlock:
  compatibility: best_effort
process:
  run_as_user: "1500"
  run_as_group: "1500"
network_policies:
  oracle_ai_database:
    name: Oracle AI Database (TLS listener)
    endpoints:
      # The client starts TLS on connect, so the proxy relays it unopened.
      - host: __DB_HOST__
        port: __DB_PORT__
        protocol: tcp
        tls: skip
    binaries:
      - path: /usr/local/bin/python3.12
