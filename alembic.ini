# Alembic migrations for the demo's clinical schema in Oracle AI Database.
# The connection comes from common/config.py (DSN from the config file,
# DA_OWNER password from the owner-only secrets directory), never from here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_table = ALEMBIC_VERSION

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
